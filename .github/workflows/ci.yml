name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:native-resources
      - run: npm run package:chrome
      - name: Install Chromium for packaged extension verification
        run: |
          npx playwright install --with-deps chromium
          browser=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          test -n "$browser"
          echo "CHROMIUM_BIN=$browser" >> "$GITHUB_ENV"
      - name: Verify packaged extension in actual Chromium
        run: |
          node scripts/performance/benchmark-extension.mjs --packaged --after-removal
          node scripts/smoke/browser/smoke-codex-model-selection.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-verification
          path: |
            results/performance/extension-*.json
            dist/verification/

  native-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:native-resources
      - name: Verify full Xcode toolchain
        run: xcodebuild -version
      - name: Compile native release
        run: swift build --package-path apps/macos --configuration release
      - name: Run native release XCTest
        run: swift test --package-path apps/macos --configuration release
      - name: Check native performance work counts and navigation
        run: |
          zsh scripts/macos/run-release-check.sh --skip-build scripts/performance/native-focused-regressions.swift
          zsh scripts/macos/run-release-check.sh --skip-build scripts/performance/native-review-regressions.swift
